set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g status-position top
set -g status-left ''
set -g status-right '#{?client_prefix,#[fg=colour125],#[fg=colour248,bold]} %h %d %Y#[fg=white,bold] %l:%M:%S %p'
set -g status-interval 1
set -g status-style bg=colour233,fg=white

set -g base-index 1
setw -g renumber-windows on

setw -g mode-keys vi

set -g default-terminal 'tmux-256color'
set -as terminal-overrides ",*:Tc"
set -g escape-time 0

set-option -g set-titles on
set-option -g set-titles-string '#H:#S.#I.#P #W #T'

setw -g window-status-format '#[fg=colour136] #I:#W#F '
setw -g window-status-current-format '#{?client_prefix,#[bg=colour125]#[fg=white],#{?pane_in_mode,#[bg=colour61]#[fg=white],#[bg=colour33]#[fg=colour16]#[bold]}} #I:#W#F '

setw -g monitor-activity on

unbind-key C-b
set -g prefix C-a
bind-key C-a send-prefix

# MOUSE CONFIG

set -g mouse on

# OSC 52 clipboard - allows remote tmux to copy to local clipboard via terminal
set -g set-clipboard on

bind-key -n WheelUpPane \
  if-shell -Ft= "#{?pane_active,0,1}" "select-pane -t=" \; \
  if-shell -Ft= "#{pane_in_mode}" \
    "send-keys -M ; send-keys -M ; send-keys -M" \
    "if-shell -Ft= \"#{mouse_any_flag}\" \
      \"send-keys -M\" \
      \"if-shell -Ft= '#{alternate_on}' \
        'send-keys Up Up Up' \
        'copy-mode -e'\""

bind-key -n WheelDownPane \
  if-shell -Ft= "#{?pane_active,0,1}" "select-pane -t=" \; \
  if-shell -Ft= "#{pane_in_mode}" \
    "send-keys -M ; send-keys -M ; send-keys -M" \
    "if-shell -Ft= \"#{mouse_any_flag}\" \
      \"send-keys -M\" \
      \"if-shell -Ft= '#{alternate_on}' \
        'send-keys Down Down Down'\""

# don't scroll to bottom after mouse select
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection -x

# exit from copy-mode with right-click
unbind-key -n MouseDown3Pane
bind-key -T copy-mode-vi MouseDown3Pane send-keys -X cancel

# integrate with system clipboard (OSC 52 handles remote → local)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key -n C-v run "xsel -bo | tmux load-buffer - ; tmux paste-buffer"

run '~/.tmux/plugins/tpm/tpm'
