# install.conf.yaml
# Dotbot setup manifest — tasks being migrated from setup.sh incrementally.
# See: https://github.com/anishathalye/dotbot

- defaults:
    link:
      create: true    # create parent directories for link destinations
      relink: true    # replace existing wrong-target symlinks; won't touch real files
      # force: false (default) — never remove real files or directories

- link:
    # General config
    ~/.inputrc: .inputrc
    ~/.lesskey: .lesskey
    ~/.tern-config: .tern-config
    ~/.tmux.conf: .tmux.conf
    ~/.markdownlintrc: .markdownlintrc
    # AI agent user preferences (cross-agent compatibility)
    ~/.claude/CLAUDE.md: USER_PREFERENCES.md
    ~/.codex/AGENTS.md: USER_PREFERENCES.md
    ~/.gemini/GEMINI.md: USER_PREFERENCES.md
    # Terminal
    ~/.config/kitty/kitty.conf: kitty.conf
    ~/.config/wezterm: wezterm
    # Vim
    ~/.vimrc: init-vim.vim
    ~/.gvimrc: init-gvim.vim
    ~/.vim/ftplugin: ftplugin
    ~/.vim/vimconfig: vimconfig
    # Neovim
    ~/.config/nvim/init.lua: nvim/init.lua
    ~/.config/nvim/ftplugin: ftplugin
    ~/.config/nvim/vimconfig: vimconfig
    ~/.config/nvim/plugins: nvim/plugins
    ~/.config/nvim/config: nvim/config
    ~/.config/nvim/util: nvim/util

- clean:
    - "~"
    - ~/.config
    - ~/.config/nvim
    - ~/.config/kitty
    - ~/.vim
    - ~/.claude
    - ~/.codex
    - ~/.gemini

- shell:
    - command: "setup/tasks/homebrew.sh"
      description: "Install Homebrew packages"
    - command: "setup/tasks/npm.sh"
      description: "Install npm global packages"
    - command: "setup/tasks/downloads.sh"
      description: "Download generated setup files"
    - command: "setup/tasks/terminfo.sh"
      description: "Compile WezTerm terminfo"
    - command: "setup/tasks/shell-profiles.sh"
      description: "Configure shell profile source lines"
    - command: "setup/tasks/git-config.sh"
      description: "Configure git include"
    - command: "setup/tasks/bat-theme.sh"
      description: "Install bat theme"
    - command: "setup/tasks/claude.sh"
      description: "Configure Claude Code"
    - command: "setup/tasks/codex.sh"
      description: "Configure Codex"
